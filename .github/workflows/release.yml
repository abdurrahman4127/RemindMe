name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: python3 -m unittest -q test_remindme
      - name: Check release version
        run: |
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^pkgver=//p' PKGBUILD)" = "$(cat VERSION)"
      - name: Build Debian package
        run: ./packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
      - name: Install and smoke-test Debian package
        run: |
          sudo apt-get install -y "./dist/remindme_${GITHUB_REF_NAME#v}_all.deb"
          remindme --help
          "/usr/bin/!remindme" --help
          "/usr/bin/!remind" --help
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows build dependencies
        run: python -m pip install -r requirements-build-windows.txt
      - name: Test Windows source
        run: python -m tools.run_ci_tests
      - name: Build Windows executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --console
          --name remindme
          --add-data "assets/banner.txt;assets"
          remindme.py
      - name: Create command-name aliases
        run: |
          Copy-Item "dist\remindme.exe" "dist\!remindme.exe"
          Copy-Item "dist\remindme.exe" "dist\!remind.exe"
      - name: Bundle Windows command aliases
        run: |
          Compress-Archive -Path "dist\remindme.exe","dist\!remindme.exe","dist\!remind.exe" -DestinationPath "dist\remindme-windows.zip"
      - name: Smoke-test Windows executable
        run: |
          & ".\dist\remindme.exe" --help
          & ".\dist\!remindme.exe" --help
          & ".\dist\!remind.exe" --help
          & ".\dist\remindme.exe" --database "$env:RUNNER_TEMP\remindme-smoke.sqlite3" in 20m "Windows package smoke test"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [debian, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          name: "!RemindMe ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/remindme.exe
            dist/remindme-windows.zip
          fail_on_unmatched_files: true
